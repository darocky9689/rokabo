<!doctype html>
<!--
  Vorlage fuer public/images/og-rokabo.png (1200x630, Linkvorschau).

  Neu erzeugen:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --allow-file-access-from-files \
      --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot=public/images/og-rokabo.png scripts/og-bild.html

  Die Schriften kommen hier von Google Fonts - das ist unbedenklich, weil die
  Datei nur lokal zur Erzeugung gerendert und nie ausgeliefert wird.

  Palette und Schriften folgen der Seite: Papier, Tinte, ein Akzent, und das
  Logo-Tuerkis ausschliesslich als Flaeche. Wer app/globals.css umfaerbt,
  zieht die Werte hier nach - sonst sieht die Linkvorschau aus wie die
  Vorgaengerfassung.

  Masse nach jeder Aenderung in lib/seo/metadata.ts und app/layout.tsx
  nachziehen, sonst stimmt die Deklaration nicht mehr mit der Datei ueberein.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 62px 76px;
    background: #fbfaf7;
    color: #17141b;
    font-family: "Instrument Sans", system-ui, sans-serif;
  }

  .kopf {
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 26px;
    border-bottom: 1px solid #ddd8d0;
  }
  .kopf img { width: 46px; height: 46px; display: block; }
  .wort {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: 34px; letter-spacing: -.02em;
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 74px;
    line-height: 1.0;
    letter-spacing: -.035em;
    max-width: 17ch;
  }
  .unter {
    margin-top: 24px;
    font-size: 26px;
    line-height: 1.5;
    color: #45404d;
    max-width: 44ch;
  }

  .fuss {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-top: 26px;
    border-top: 1px solid #ddd8d0;
  }
  /* Tuerkis nur als Flaeche - als Schriftfarbe haette es auf Papier 1,6:1. */
  .preis {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: 34px;
    background-image: linear-gradient(#40e0d0, #40e0d0);
    background-size: 100% .3em;
    background-position: 0 88%;
    background-repeat: no-repeat;
  }
  .domain {
    font-size: 22px; font-weight: 500;
    letter-spacing: .08em; text-transform: uppercase;
    color: #6f6a77;
  }
</style>
</head>
<body>
  <div class="kopf">
    <img src="../public/images/rokabo-mark.png" alt="">
    <span class="wort">rokabo</span>
  </div>
  <div>
    <h1>Eine Website, um die sich jemand kümmert.</h1>
    <p class="unter">Gebaut, betreut und dauerhaft aktuell — ohne hohe Startkosten.</p>
  </div>
  <div class="fuss">
    <span class="preis">ab 49 € im Monat</span>
    <span class="domain">rokabo.de</span>
  </div>
</body>
</html>
